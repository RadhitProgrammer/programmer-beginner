<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fecfef 50%, #a8edea 75%, #fed6e3 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        #envelope {
            position: relative;
            width: 300px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
        }
        #envelope.closed .envelope-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ffb3ba);
            border-radius: 10px 10px 0 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #envelope.closed .envelope-back {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(135deg, #ffb3ba, #ff6b6b);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #envelope.open {
            transform: rotateX(180deg);
        }
        .tap-text {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #c21807;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 20px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: none;
        }
        .letter-content {
            text-align: center;
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #c21807;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
        }
        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 768px) {
            #envelope {
                width: 250px;
                height: 160px;
            }
            h1 {
                font-size: 1.5rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="envelope" class="closed">
        <div class="envelope-front"></div>
        <div class="envelope-back"></div>
        <div class="tap-text">tap to open</div>
    </div>
    <div id="letter">
        <div class="letter-content">
            <h1>Happy Valentine!</h1>
            <p>Dear [Nama], kamu adalah cinta sejati aku. Aku ingin bilang bahwa kamu sangat spesial...</p>
        </div>
    </div>
    <div id="jumpscare">
        <img src="images/hantu.jpg" alt="Jumpscare">
        <audio id="scream-audio" preload="auto">
            <source src="audio/kuntilanak.mp3" type="audio/mpeg">
        </audio>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const envelope = document.getElementById('envelope');
            const letter = document.getElementById('letter');
            const jumpscare = document.getElementById('jumpscare');
            const audio = document.getElementById('scream-audio');

            // Open envelope
            envelope.addEventListener('click', function() {
                envelope.classList.add('open');
                setTimeout(() => {
                    letter.style.display = 'block';
                    setTimeout(() => {
                        // Trigger jumpscare after a short delay
                        jumpscare.style.display = 'flex';
                        audio.volume = 1.0; // Max volume for prank effect
