<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Online Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .produk {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .item {
            border: 1px solid #ddd;
            padding: 15px;
            width: 200px;
            text-align: center;
            border-radius: 8px;
        }
        .item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        #keranjang-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #007bff;
        }
        #keranjang-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        #keranjang-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Selamat Datang di Market Online!</h1>
        <p>Temukan produk terbaik dengan harga terjangkau.</p>
    </header>
    
    <div class="container">
        <h2>Daftar Produk</h2>
        <div class="produk" id="produk-list">
            <!-- Produk akan ditambahkan secara dinamis -->
        </div>
    </div>
    
    <button id="keranjang-btn">Lihat Keranjang (0)</button>
    
    <div id="keranjang-modal">
        <div id="keranjang-content">
            <h3>Keranjang Belanja</h3>
            <ul id="keranjang-list"></ul>
            <p>Total: Rp<span id="total">0</span></p>
            <button onclick="checkout()">Checkout</button>
            <button onclick="tutupKeranjang()">Tutup</button>
        </div>
    </div>
    
    <script>
        // Data produk (contoh sederhana)
        const produkData = [
            { nama: "Apel", harga: 5000, gambar: "https://via.placeholder.com/200x150?text=Apel" },
            { nama: "Pisang", harga: 3000, gambar: "https://via.placeholder.com/200x150?text=Pisang" },
            { nama: "Jeruk", harga: 4000, gambar: "https://via.placeholder.com/200x150?text=Jeruk" },
            { nama: "Mangga", harga: 7000, gambar: "https://via.placeholder.com/200x150?text=Mangga" }
        ];
        
        let keranjang = [];
        
        // Fungsi untuk menampilkan produk
        function tampilkanProduk() {
            const produkList = document.getElementById('produk-list');
            produkData.forEach(produk => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <img src="${produk.gambar}" alt="${produk.nama}">
                    <h3>${produk.nama}</h3>
                    <p>Rp${produk.harga}</p>
                    <button onclick="tambahKeKeranjang('${produk.nama}', ${produk.harga})">Tambah ke Keranjang</button>
                `;
                produkList.appendChild(item);
            });
        }
        
        // Fungsi tambah ke keranjang
        function tambahKeKeranjang(nama, harga) {
            keranjang.push({ nama, harga });
            updateKeranjang();
            alert(`${nama} ditambahkan ke keranjang!`);
        }
        
        // Update keranjang
        function updateKeranjang() {
            const btn = document.getElementById('keranjang-btn');
            btn.textContent = `Lihat Keranjang (${keranjang.length})`;
            
            const list = document.getElementById('keranjang-list');
            list.innerHTML = '';
            let total = 0;
            keranjang.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.nama} - Rp${item.harga}`;
                list.appendChild(li);
                total += item.harga;
            });
            document.getElementById('total').textContent = total;
        }
        
        // Buka/tutup modal keranjang
        document.getElementById('keranjang-btn').onclick = () => {
            document.getElementById('keranjang-modal').style.display = 'flex';
        };
        
        function tutupKeranjang() {
            document.getElementById('keranjang-modal').style.display = 'none';
        }
        
        // Fungsi checkout (sederhana)
        function checkout() {
            if (keranjang.length > 0) {
                alert(`Checkout berhasil! Total: Rp${document.getElementById('total').textContent}`);
                keranjang = [];
                updateKeranjang();
                tutupKeranjang();
            } else {
                alert('Keranjang kosong!');
            }
        }
        
        // Inisialisasi
        tampilkanProduk();
    </script>
</body>
</html>
